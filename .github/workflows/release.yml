name: release

# A tag vX.Y.Z runs every test, then creates a draft GitHub Release with the
# Python package, the engine archives, checksums and build provenance.
# The draft is published by hand after it has been looked at.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # a manual run is a rehearsal: it builds everything and uploads the files as
  # a workflow artifact, but makes no release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    name: Draft release
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check that the tag matches the package version
        if: github.event_name == 'push'
        run: |
          version="$(python -c 'import px4_ca_lint; print(px4_ca_lint.__version__)')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
          if ! grep -q "^## ${version} " CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
      - name: Build the Python package
        run: |
          python -m pip install build==1.6.1
          python -m build --outdir dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: px4_ca_engine-*
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          cd dist
          ls -l
          # one file with every checksum; the per-archive files are not needed
          rm -f ./*.sha256
          sha256sum ./* | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS
          cd ..
          python tools/release_notes.py "$(python -c 'import px4_ca_lint; print(px4_ca_lint.__version__)')" > notes.md
          cat notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'push'
        with:
          name: release-rehearsal
          path: |
            dist/
            notes.md
          if-no-files-found: error
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push'
        with:
          subject-path: dist/*
      - name: Create the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --draft --verify-tag --title "${GITHUB_REF_NAME}" --notes-file notes.md
